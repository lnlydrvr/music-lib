[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-lib"
version = "0.1.0"
description = "Local music library: tags, lyrics, health checks and recommendations (FastAPI + SPA)"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "mutagen>=1.47.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "qrcode>=8.2",
    "fastembed>=0.7.0",
    "ytmusicapi>=1.12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
music-lib = "src.app:main"
music-dl = "src.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
force-include = { "frontend/src/locales/registry.json" = "src/locale_registry.json" }
